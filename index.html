 $('routes').innerHTML=paths.map(([target,label],i)=>b('<span class="num">0'+(i+1)+'</span>'+label+'<small>↗</small>','route:'+target,'route '+(page===target?'active':''))).join('');
 $('bar').innerHTML=(page==='welcome'?'<span style="width:7px"></span>':b('‹','back'))+'<strong>'+(page==='chat'?e(matchedPerson):titles[page])+'</strong>'+ (page==='chat'?b('⋯','chatMenu'):b('Demo','demo','mobile-demo'));
 $('tabs').hidden=onboarding.includes(page);
 $('tabs').style.display=onboarding.includes(page)?'none':'grid';
 $('tabs').innerHTML=[['Discover','◇'],['Messages','✉'],['Profile','♙']].map(([label,icon])=>go('<span aria-hidden="true">'+icon+'</span>'+label,label.toLowerCase(),label===tab?'selected':'')).join('');
 $('screen').innerHTML=views[page]();
 $('screen').scrollTop=page==='chat'?$('screen').scrollHeight:0;
 drawModal();
}

function scopeHelp(scope){return scope==='Only me'?'Only you can see this summary.':'Only matches you approve can see this summary.'}
function recordCard(){return card('<h3>Private record</h3><small>Stays in the app</small>'+line('Relationship period',e(state.period))+line('Short summary',e(state.summary))+line('Summary visibility',e(state.scope)),'jade')}
const samples={Maya:['That café sounds great.','10:24 AM'],Alex:['See you this weekend.','Yesterday']};
function inbox(query){
 const names=(state.matched?['David','Maya','Alex']:['Maya','Alex']).filter(n=>n.toLowerCase().includes(query.trim().toLowerCase()));
 if(!names.length)return card('No conversations found.');
 return names.map(n=>n==='David'?card('<div class="row">'+pic(n,'avatar')+'<div class="grow"><h3>David</h3><small>New match</small></div><span class="chip">●</span></div><div class="row" style="margin-top:10px">'+go('View match','match')+b('Say hello','chat:David','primary')+'</div>','tint'):b(pic(n,'avatar')+'<span class="grow">'+n+'<br><small>'+e(state.chat[n].at(-1)?.text||samples[n][0])+'</small></span><small>'+samples[n][1]+(n==='Maya'?' · ●':'')+'</small>','chat:'+n,'entry')).join('');
}
function conversation(){
 const messages=state.chat[matchedPerson];
 return (matchedPerson==='David'&&!messages.length?'<div class="center" style="padding-top:48px"><div class="chip jade">◇</div><h2>Say hello to David</h2>'+(mutual()?'<p>You’re both looking for a long-term relationship.</p>':'')+b('Get a conversation starter','starter','wide')+'</div>':'')+(samples[matchedPerson]?bubble({text:samples[matchedPerson][0],time:samples[matchedPerson][1]},false):'')+messages.map(msg=>bubble(msg,!msg.incoming)).join('');
}
function bubble(msg,own){return '<div class="bubble '+(own?'me':'')+'">'+e(msg.text)+'<small>'+e(msg.time)+'</small></div>'}
function send(value){
 const text=value.trim().slice(0,500);if(!text)return;
 const time=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
 state.chat[matchedPerson].push({text,time});
 if(matchedPerson==='David'&&state.chat.David.length===1&&text.startsWith('When you go somewhere new'))state.chat.David.push({text:'I usually pick one place and see where the day goes from there.',time:'Demo reply',incoming:true});
 draft='';modal='';save();render();
}
function suggest(type){
 const options={
  bazi:['Inspired by your Destiny Teaser','When you go somewhere new, do you like to plan ahead or see where the day takes you?'],
  quick:['Based on a shared preference','What does a good Sunday look like when you’re getting to know someone?'],
  general:['General idea','What’s something you’re looking forward to this weekend?'],
  follow:['Recent chat context · Demo','Is there a neighbourhood you’d like to explore together sometime?']
 };
 [source,suggestion]=options[type];open('suggest');
}
function open(which){modal=which;drawModal();$('modal').querySelector('button')?.focus()}
function closeModal(){modal='';drawModal();$('screen').focus({preventScroll:true})}

 $('bar').inert=$('screen').inert=$('tabs').inert=Boolean(modal);
 if(!modal){$('modal').innerHTML='';return}

 };
 const master=modal.startsWith('master:')?modal.slice(7):'';
 const content=master?mTitle(master)+pic(master)+card(master==='Ming Lau'?'Ming is a fictional educator who introduces the Four Pillars and explains how to read a Day Master.':'Suki is a fictional educator who explores the Five Elements through everyday cultural examples.'):(sheets[modal]?.()||'');

function start(){state.started=true;save();jump('discover')}
function rememberRecord(formElement){
 if(!formElement.reportValidity())return false;
 const fd=new FormData(formElement);if(!fd.get('period').trim()||!fd.get('summary').trim()){toast('Enter a period and a summary');return false}
 state.period=fd.get('period').trim();state.summary=fd.get('summary').trim();state.scope=fd.get('scope');state.record='Draft';save();return true;
}
const actions={
 back,close:closeModal,quick:()=>{state.mode='Not set';start()},start,
 like:()=>{state.matched=true;matchedPerson='David';draft='';save();jump('chat')},
 starter:()=>suggest(compatible()?'bazi':mutual()?'quick':'general'),
 follow:()=>state.context?suggest('follow'):open('context'),
 general:()=>suggest('general'),sendSuggestion:()=>send(suggestion),
 editSuggestion:()=>{draft=suggestion;closeModal();const input=$('screen').querySelector('[name=message]');input.value=draft;input.focus();input.setSelectionRange(draft.length,draft.length)},
 shareConfirm:()=>{state.shared=true;save();jump('private',true);toast('Shared with Emma')},
 shareKeep:()=>{jump('private',true);toast('Sharing settings unchanged')},

 restoreFilters:()=>{Object.assign(state,{age:'24–30',area:'Hong Kong Island',goal:'Long-term'});save();render()},
 report:()=>{report=!report;render()},
 clearBirth:()=>{state.mode='Not set';save();jump('profile',true);toast('BaZi data cleared')},
 reset:()=>{clearTimeout(authTimer);clearTimeout(paymentTimer);state=fresh();save();processing=false;recording=false;history=[];mode='Full';pin='';draft='';report=false;jump('welcome',true);toast('Demo reset')},
 copy:async()=>{const url='https://redthread.example/invite/REDTHREAD';try{await navigator.clipboard.writeText(url);toast('Link copied')}catch{window.prompt('Copy demo invite link',url)}},
 draftRecord:()=>{if(rememberRecord(document.querySelector('[data-form=record]')))jump('status')},
 pay:()=>{if(processing||state.record!=='Recorded · Demo')return;processing=true;render();paymentTimer=setTimeout(()=>{processing=false;state.unlocked=true;save();if(page==='checkout')jump('success',true);else{render();toast('Serious Commitment unlocked')}},950)},
 appeal:()=>{if(state.feedback!=='Review requested · Demo'){state.feedback='Review requested · Demo';save();render();toast('Review requested')}}
};
document.addEventListener('click',event=>{
 const btn=event.target.closest('[data-act]');if(!btn||btn.disabled)return;
 const [act,value]=btn.dataset.act.split(':');
 if(act==='backdrop'){if(event.target===btn)closeModal();return}
 if(act==='go'){jump(value);return}
 if(act==='route'){route(value);return}
 if(act==='mode'){mode=value;render();return}
 if(act==='chat'){matchedPerson=value;draft='';jump('chat');return}
 if(act==='vis'){state.visibility=value;save();render();return}
 if(act==='pin'){pin=value;render();return}
 if(act==='master'){open('master:'+value);return}
 if(actions[act])actions[act]();else open(act);
});
document.addEventListener('input',event=>{
 const t=event.target;
 if(t.id==='search')$('results').innerHTML=inbox(t.value);
 if(t.name==='message')draft=t.value;
 if(t.name==='scope'&&$('scopeHelp'))$('scopeHelp').textContent=scopeHelp(t.value);
 const f=t.form;if(!f)return;
 const kind=f.dataset.form;
 if(['agreement','authorize','bazi'].includes(kind)){
  const box=f.querySelector('[type=checkbox]');
  f.querySelector('button').disabled=!box.checked||!f.checkValidity()||(kind==='bazi'&&mode==='Full'&&!f.elements.place.value.trim());
 }
});
document.addEventListener('submit',event=>{
 const f=event.target;const kind=f.dataset.form;if(!kind)return;event.preventDefault();
 const d=new FormData(f);
 switch(kind){
  case 'signin':
   if(d.get('email').trim().toLowerCase()==='emma@example.test'&&d.get('password')==='redthread'){start();break}
   f.elements.password.type='password';document.querySelector('[data-act=password]').textContent='Show password';$('signError').textContent='Check your email or password and try again.';break;
  case 'age':{
   const now=new Date(),dob=new Date(d.get('dob')+'T00:00:00'),cutoff=new Date(now.getFullYear()-18,now.getMonth(),now.getDate());
   if(!Number.isFinite(dob.valueOf())||dob>cutoff){$('ageError').textContent='You must be 18 or older to continue.';break}
   jump('prefs');break;
  }
  case 'prefs':case 'filters':
   for(const key of ['age','area','goal','gender','interestedIn'])state[key]=d.get(key);
   save();if(kind==='prefs')jump('begin');else{modal='';render();toast('Filters applied')}break;
  case 'bazi':
   if(!d.has('consent')||(mode==='Full'&&!d.get('place').trim()))return;
   state.mode=mode;save();jump('insight');break;
  case 'send':send(d.get('message'));break;
  case 'permission':state.context=d.has('context');save();closeModal();if(page==='chat'&&state.context)suggest('follow');else toast('Permission saved');break;
  case 'bio':if(!d.get('bio').trim())return;state.bio=d.get('bio').trim();save();modal='';render();toast('Preview updated');break;
  case 'agreement':if(d.has('agree'))jump('record');break;
  case 'record':if(rememberRecord(f))jump('authorize');break;
  case 'authorize':
   if(!d.has('authorize')||recording||state.record!=='Draft')return;
   recording=true;jump('status',true);
   authTimer=setTimeout(()=>{recording=false;state.record='Recorded · Demo';save();render()},900);break;
  case 'claim':
   if(!d.get('details').trim()||!d.has('claimConsent'))return;
   state.claim='Submitted for review · Demo';save();render();break;
  case 'feedback':
   if(!d.get('feedback').trim())return;
   state.feedback='Pending moderation · Demo';save();render();break;
 }
});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&modal){closeModal();return}
 if(event.key!=='Tab'||!modal)return;
 const items=[...$('modal').querySelectorAll('button:enabled,input:enabled,textarea:enabled,select:enabled,summary')];
 if(!items.length)return;
 if(event.shiftKey&&document.activeElement===items[0]){event.preventDefault();items.at(-1).focus()}
 else if(!event.shiftKey&&document.activeElement===items.at(-1)){event.preventDefault();items[0].focus()}
});
render();

function fatePanel(){return '<div class="destiny"><div class="fate-label">天緣巧合 · THREADS OF DESTINY</div><h2>Different rhythms.<br>A shared direction.</h2><div class="twins">'+pic('Emma')+pic('David')+'</div><div class="thread"></div><p>Emma · Yang Wood &nbsp; ♡ &nbsp; David · Yin Water</p><small style="color:#ead7c5">Illustrative BaZi pairing · Cultural reflection</small></div>'}
